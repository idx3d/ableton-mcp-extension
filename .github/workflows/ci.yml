name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monthly canary: catch dependency/toolchain rot even when the repo is quiet.
    - cron: "0 6 1 * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run gen:tools
      - run: git diff --exit-code docs/tools.md
      - run: npm run typecheck
      - run: npm test

  # The extension's real targets. Skipped on PRs to conserve runner minutes
  # (macOS bills 10x on private repos); runs on main and the monthly canary.
  platforms:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
